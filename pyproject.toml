[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speech-lexicon-kit"
version = "0.0.1"
description = "The shared speech kernel for hexagonal agent repos: speech-to-text / text-to-speech / diarization ports, the transcript / speaker-turn / word-offset / channel-role / redaction-span types, locale-sensitive deterministic normalisation and phrase matching producing lexicon hits, and ordered-phrase adherence primitives. Pure standard library, no clock and no I/O: every function that needs a time takes as_of from the caller."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashish Awasthi" }]
keywords = [
  "speech-to-text", "text-to-speech", "diarization", "transcript", "lexicon",
  "phrase-matching", "normalisation", "locale", "deterministic", "replay",
  "hexagonal", "ports-and-adapters",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]

# ZERO runtime dependencies. Everything here is stdlib (unicodedata, dataclasses, hashlib,
# json, re), so the kernel installs and runs on an air-gapped host and a consumer inherits
# no transitive runtime deps. There is deliberately no HTTP client and no cloud SDK: the
# ports are typing.Protocol declarations, and the adapters live in the consuming repo.
dependencies = []

[project.optional-dependencies]
# The test/lint toolchain. Ruff is pinned EXACTLY so formatting never drifts across machines.
dev = [
  "ruff==0.16.3",
  "mypy>=1.10",
  "pytest>=8.2",
]

[project.urls]
Homepage = "https://github.com/portable-genai/speech-lexicon-kit"
Source = "https://github.com/portable-genai/speech-lexicon-kit"
Issues = "https://github.com/portable-genai/speech-lexicon-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/speech_lexicon_kit"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: needs a resource outside this repo; excluded from the offline gate",
]
